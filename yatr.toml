# Generated by yatr rollout — adjust as needed.

[tasks.dev]
run = ["npm run dev"]
foreground = true

[tasks.build]
run = ["npm run build"]
no_cache = true

[tasks.site-check]
desc = "Astro type and content check, and the resume PDF against its data"
run = ["npm run check"]
# No sources declared, so a cached run keys on the command alone and would
# replay a pass after src/ changed. A gate must not be served from cache.
no_cache = true

[tasks.favicon]
desc = "Redraw the favicon set from scripts/make-favicon.py"
run = ["python3 scripts/make-favicon.py"]
sources = ["scripts/make-favicon.py"]
outputs = ["public/apple-touch-icon.png", "public/icon-192.png", "public/favicon.ico"]

[tasks.resume-pdf]
desc = "Rebuild the resume PDF from src/data/resume.ts (needs `npx playwright install chromium` once)"
run = ["npm run resume-pdf"]
no_cache = true

[tasks.ci]
desc = "CI pipeline"
depends = ["site-check", "build"]
